<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية OFK - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #102a43;
        }
        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(16, 42, 67, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .logo-container h1 {
            color: #004080;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .logo-container p {
            color: #627d98;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #243b53;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #bcccdc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #004080;
        }
        .btn-login {
            width: 100%;
            background-color: #004080;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background-color: #00264d;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #829ab1;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <h1>أكاديمية OFK</h1>
            <p>الشراكة الاستراتيجية مع جامعة الزهراء</p>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">اسم المستخدم أو الرمز</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم (مثل: Omr123)" required>
            </div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>
        
        <div class="footer-note">
            مركز التعليم التطبيقي والمستمر © 2026
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const val = document.getElementById('username').value.trim();
            if (val.startsWith('Omr12345')) {
                window.location.href = 'admin-portal.html';
            } else if (val.startsWith('Omr1234')) {
                window.location.href = 'instructor-portal.html';
            } else {
                window.location.href = 'student-portal.html';
            }
        }
    </script>
</body>
</html>
