<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب الأكاديمية | OFK Academy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- رأس الصفحة -->
    <header class="max-w-4xl mx-auto w-full bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 shadow-2xl backdrop-blur-md flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4">
            <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl">
                <i class="fa-solid fa-user-graduate text-amber-400 text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">بوابة الطالب الأكاديمية</h1>
                <p class="text-xs text-amber-400 mt-0.5">مرحباً بك، طالب تجريبي (جامعة الزهراء)</p>
            </div>
        </div>
        <a href="index.html" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold px-4 py-2.5 rounded-xl transition-colors flex items-center gap-2">
            <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
        </a>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-4xl mx-auto w-full space-y-6 my-6">
        <!-- إحصائيات سريعة -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-2xl flex items-center gap-4">
                <div class="bg-blue-500/10 text-blue-400 p-3 rounded-xl"><i class="fa-solid fa-book text-lg"></i></div>
                <div>
                    <p class="text-xs text-slate-400">المقررات المسجلة</p>
                    <h3 class="text-lg font-bold text-white">4 مقررات</h3>
                </div>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-2xl flex items-center gap-4">
                <div class="bg-emerald-500/10 text-emerald-400 p-3 rounded-xl"><i class="fa-solid fa-circle-check text-lg"></i></div>
                <div>
                    <p class="text-xs text-slate-400">نسبة الإنجاز</p>
                    <h3 class="text-lg font-bold text-white">75%</h3>
                </div>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-2xl flex items-center gap-4">
                <div class="bg-amber-500/10 text-amber-400 p-3 rounded-xl"><i class="fa-solid fa-award text-lg"></i></div>
                <div>
                    <p class="text-xs text-slate-400">المعدل التراكمي</p>
                    <h3 class="text-lg font-bold text-white">ممتاز</h3>
                </div>
            </div>
        </div>

        <!-- قائمة الدروس والمحاضرات (متزامنة حقيقياً من بوابة المدرس) -->
        <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-book-open text-amber-500"></i>
                <span>الدروس والمحاضرات المتاحة للمقرر</span>
            </h3>
            <div id="studentLessonsContainer" class="space-y-3">
                <p class="text-xs text-slate-400">جاري تحميل المحتوى الأكاديمي...</p>
            </div>
        </div>
    </main>

    <!-- تذييل الصفحة -->
    <footer class="max-w-4xl mx-auto w-full text-center text-xs text-slate-500 border-t border-slate-800 pt-4">
        OFK Academy &copy; 2026 - جميع الحقوق محفوظة بالتعاون مع جامعة الزهراء
    </footer>

    <!-- خوارزمية جلب الدروس محلياً -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('studentLessonsContainer');
            const lessons = JSON.parse(localStorage.getItem('ofk_dynamic_lessons') || '[]');
            
            if (lessons.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 bg-slate-900/40 p-4 rounded-xl border border-slate-800">لا توجد دروس منشورة حالياً من قبل المدرس. يرجى الانتظار لحين إضافتها.</p>`;
                return;
            }
            
            container.innerHTML = '';
            lessons.forEach(lesson => {
                container.innerHTML += `
                    <div class="bg-slate-900/60 border border-slate-700/60 p-4 rounded-xl flex items-center justify-between">
                        <div>
                            <h4 class="font-bold text-sm text-white">${lesson.title}</h4>
                            <p class="text-xs text-amber-400 mt-1">تاريخ النشر: ${lesson.date} | بواسطة: ${lesson.instructor}</p>
                        </div>
                        <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-3 py-1.5 rounded-lg font-bold">متاح للتعلم</span>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
