<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب | OFK Academy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- شريط التنصيب العلوي للطالب -->
    <header class="bg-white shadow-sm h-20 flex items-center justify-between px-8 sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                <i class="fa-solid fa-graduation-cap text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900">بوابة الطالب التعليمية</h1>
                <p class="text-xs text-indigo-600">OFK Academy</p>
            </div>
        </div>
        <button onclick="logout()" class="text-rose-500 font-semibold text-sm hover:underline flex items-center gap-2">
            <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-5xl mx-auto p-8 w-full flex-grow space-y-8">
        
        <!-- بطاقة الترحيب والتصفية -->
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-2xl font-extrabold text-slate-900">مرحباً بك أيها الطالب المجتهد!</h2>
            <p class="text-sm text-slate-500">اختر التخصص لعرض المحاضرات وروابط البث المباشر المتاحة من قِبل أساتذة الأكاديمية.</p>
            
            <div class="flex flex-wrap gap-2 pt-2">
                <button onclick="filterSpecialty('الكل')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold transition filter-btn">الكل</button>
                <button onclick="filterSpecialty('الحوسبة السحابية')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition filter-btn">الحوسبة السحابية</button>
                <button onclick="filterSpecialty('الذكاء الاصطناعي')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition filter-btn">الذكاء الاصطناعي</button>
                <button onclick="filterSpecialty('الأمن السيبراني')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition filter-btn">الأمن السيبراني</button>
                <button onclick="filterSpecialty('هندسة البرمجيات')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition filter-btn">هندسة البرمجيات</button>
            </div>
        </div>

        <!-- قائمة المحاضرات المتاحة -->
        <div class="space-y-4">
            <h3 class="text-lg font-bold text-slate-900">المحاضرات والدروس الحية المتاحة</h3>
            <div id="studentLecturesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-sm text-slate-500">جاري جلب المحاضرات من السحابة...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzp8h6SDNFF_6jtcyi0CKmAnb3q0Z-U_A",
            authDomain: "ofk-academy.firebaseapp.com",
            projectId: "ofk-academy",
            storageBucket: "ofk-academy.firebasestorage.app",
            messagingSenderId: "323159437100",
            appId: "1:323159437100:web:2cc41d6e2727737aea8689",
            measurementId: "G-BG5BDJL9EF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allLectures = [];

        window.addEventListener('DOMContentLoaded', async () => {
            if (localStorage.getItem('ofk_role') !== 'student') { window.location.href = 'index.html'; }
            
            try {
                const querySnapshot = await getDocs(collection(db, "lectures"));
                allLectures = [];
                querySnapshot.forEach((doc) => {
                    allLectures.push(doc.data());
                });
                renderLectures(allLectures);
            } catch (e) {
                console.error(e);
                document.getElementById('studentLecturesGrid').innerHTML = "<p class='text-rose-500 text-sm'>خطأ في الاتصال بقاعدة البيانات.</p>";
            }
        });

        window.renderLectures = function(lectures) {
            let gridHtml = "";
            lectures.forEach((data) => {
                gridHtml += `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-4">
                        <div>
                            <span class="inline-block px-3 py-1 rounded-lg bg-indigo-50 text-indigo-600 text-xs font-bold mb-2">${data.specialty}</span>
                            <h4 class="font-bold text-slate-900 text-base">${data.title}</h4>
                        </div>
                        <a href="${data.fileUrl}" target="_blank" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-center text-xs transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-play"></i> مشاهدة المحاضرة / الدخول للبث
                        </a>
                    </div>
                `;
            });
            if(lectures.length === 0) {
                gridHtml = "<p class='text-slate-500 text-sm col-span-2'>لا توجد محاضرات منشورة في هذا التخصص حالياً.</p>";
            }
            document.getElementById('studentLecturesGrid').innerHTML = gridHtml;
        }

        window.filterSpecialty = function(spec) {
            if (spec === 'الكل') {
                renderLectures(allLectures);
            } else {
                const filtered = allLectures.filter(l => l.specialty === spec);
                renderLectures(filtered);
            }
        }
    </script>

    <script>
        function logout() { localStorage.removeItem('ofk_role'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
