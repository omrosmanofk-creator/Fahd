<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الأستاذ - أكاديمية OFK</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f7f6; color: #333; direction: rtl; }
        header { background: #004080; color: white; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        header h1 { font-size: 26px; margin-bottom: 5px; }
        header p { font-size: 14px; opacity: 0.9; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #004080; }
        .card h2 { color: #004080; margin-bottom: 20px; font-size: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { text-align: right; margin-bottom: 15px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #243b53; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #bcccdc; border-radius: 8px; font-size: 15px; outline: none; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #004080; }
        .btn-primary { background-color: #004080; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.3s; width: 100%; }
        .btn-primary:hover { background-color: #00264d; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #004080; text-decoration: none; font-weight: 600; font-size: 15px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>بوابة الأستاذ والأكاديمي</h1>
        <p>مركز التعليم التطبيقي والمستمر - أكاديمية OFK بالتعاون مع جامعة الزهراء</p>
    </header>

    <div class="container">
        <a href="index.html" class="back-link">← العودة لصفحة تسجيل الدخول</a>

        <!-- رفع المحتوى التعليمي (ملفات PDF أو فيديوهات) -->
        <div class="card">
            <h2>رفع محتوى تعليمي للدروس (PDF / فيديو)</h2>
            <form onsubmit="handleUpload(event)">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="uploadSpec">اختر التخصص / الكلية</label>
                        <select id="uploadSpec" required>
                            <option value="">اختر التخصص...</option>
                            <option value="الإرشاد النفسي والتطوير التعليمي">1. الإرشاد النفسي والتطوير التعليمي</option>
                            <option value="العلوم الشرعية والدراسات القرآنية">2. العلوم الشرعية والدراسات القرآنية</option>
                            <option value="الأمن السيبراني وحماية الأنظمة">3. الأمن السيبراني وحماية الأنظمة</option>
                            <option value="الذكاء الاصطناعي والتقنيات الرقمية">4. الذكاء الاصطناعي والتقنيات الرقمية</option>
                            <option value="الصحة النفسية والاستشارية">5. الصحة النفسية والاستشارية</option>
                            <option value="اللغة العربية ومفرداتها">6. اللغة العربية ومفرداتها</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="courseName">اسم المادة أو الدرس</label>
                        <input type="text" id="courseName" placeholder="مثال: الدرس الأول - مدخل علم النفس" required>
                    </div>
                    <div class="form-group">
                        <label for="contentType">نوع المحتوى</label>
                        <select id="contentType" required>
                            <option value="PDF">ملف محاضرة (PDF)</option>
                            <option value="Video">رابط فيديو الشرح</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label for="contentLink">رابط الملف أو الفيديو</label>
                        <input type="text" id="contentLink" placeholder="أضف رابط التحميل أو رابط الفيديو هنا" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">نشر المحتوى للطلاب</button>
            </form>
        </div>

        <!-- إرسال الإعلانات والرسائل للكلية -->
        <div class="card">
            <h2>إرسال إعلان أو تنبيه لطلاب الكلية</h2>
            <form onsubmit="handleAnnouncement(event)">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="announcementSpec">الكلية المستهدفة بالإعلان</label>
                        <select id="announcementSpec" required>
                            <option value="">اختر التخصص...</option>
                            <option value="جميع التخصصات">جميع التخصصات والكليات</option>
                            <option value="الإرشاد النفسي والتطوير التعليمي">1. الإرشاد النفسي والتطوير التعليمي</option>
                            <option value="العلوم الشرعية والدراسات القرآنية">2. العلوم الشرعية والدراسات القرآنية</option>
                            <option value="الأمن السيبراني وحماية الأنظمة">3. الأمن السيبراني وحماية الأنظمة</option>
                            <option value="الذكاء الاصطناعي والتقنيات الرقمية">4. الذكاء الاصطناعي والتقنيات الرقمية</option>
                            <option value="الصحة النفسية والاستشارية">5. الصحة النفسية والاستشارية</option>
                            <option value="اللغة العربية ومفرداتها">6. اللغة العربية ومفرداتها</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label for="announcementText">نص الإعلان أو التنبيه</label>
                        <textarea id="announcementText" rows="4" placeholder="اكتب تفاصيل الإعلان أو موعد البث المباشر هنا..." required></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-primary">إرسال الإعلان للطلاب</button>
            </form>
        </div>
    </div>

    <script>
        function handleUpload(e) {
            e.preventDefault();
            alert('تم نشر المحتوى التعليمي بنجاح وأصبح متاحاً لطلاب التخصص!');
            e.target.reset();
        }

        function handleAnnouncement(e) {
            e.preventDefault();
            alert('تم إرسال التنبيه أو الإعلان لجميع طلاب الكلية بنجاح!');
            e.target.reset();
        }
    </script>

</body>
</html>
