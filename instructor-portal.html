<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الأستاذ المتكاملة | OFK Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- الشريط العلوي -->
    <header class="bg-white shadow-sm border-b border-slate-200 h-16 flex items-center justify-between px-4 sm:px-8 sticky top-0 z-30">
        <h1 class="text-sm sm:text-xl font-bold text-slate-900 truncate">بوابة الأستاذ - إدارة المحتوى والدروس</h1>
        <div class="flex items-center gap-3 shrink-0">
            <a href="index.html" class="text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900">الرئيسية</a>
            <button onclick="logout()" class="text-rose-600 font-semibold text-xs sm:text-sm hover:underline">تسجيل الخروج</button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 sm:p-8 w-full flex-grow space-y-6">

        <!-- إعلان المدير الخاص بالمدرسين فقط -->
        <section id="instructorNoticeBox" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 sm:p-5 shadow-sm space-y-1">
            <div class="flex items-center gap-2 text-amber-900 font-bold text-xs sm:text-sm">
                <i class="fa-solid fa-bullhorn text-amber-600"></i>
                <span id="instructorNoticeTitleDisplay">إعلان إداري للمدرسين</span>
            </div>
            <p id="instructorNoticeBodyDisplay" class="text-xs sm:text-sm text-amber-950/90 leading-relaxed"></p>
        </section>

        <!-- بطاقة نشر المحاضرات -->
        <section class="bg-white p-5 sm:p-8 rounded-3xl shadow-sm border border-slate-200 space-y-6">
            <h2 class="text-lg sm:text-xl font-bold text-slate-900">نشر محاضرة جديدة أو روابط البث المباشر للتخصصات</h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">عنوان المحاضرة أو المادة</label>
                    <input type="text" id="lectureTitle" placeholder="مثال: محاضرة الذكاء الاصطناعي التطبيقي..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 outline-none text-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">التخصص المستهدف</label>
                    <select id="courseSpecialty" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 outline-none text-sm bg-white">
                        <option value="الإرشاد النفسي والتطوير التعليمي">الإرشاد النفسي والتطوير التعليمي</option>
                        <option value="العلوم الشرعية والدراسات القرآنية">العلوم الشرعية والدراسات القرآنية</option>
                        <option value="الأمن السيبراني وحماية الأنظمة">الأمن السيبراني وحماية الأنظمة</option>
                        <option value="الذكاء الاصطناعي والتقنيات الرقمية">الذكاء الاصطناعي والتقنيات الرقمية</option>
                        <option value="الصحة النفسية والاستشارية">الصحة النفسية والاستشارية</option>
                        <option value="اللغة العربية ومفرداتها">اللغة العربية ومفرداتها</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">رابط الفيديو أو البث المباشر (يوتيوب / رابط خارجي)</label>
                    <input type="text" id="lectureUrl" placeholder="https://www.youtube.com/watch?v=..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 outline-none text-sm">
                </div>

                <div id="uploadSuccessMsg" class="p-4 bg-emerald-50 text-emerald-700 rounded-xl text-sm font-semibold hidden">
                    ✓ تم نشر المحاضرة بنجاح وحفظها في قاعدة بيانات السحابة للطلاب!
                </div>

                <button onclick="publishLecture()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
                    نشر المحاضرة في السحابة
                </button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzp8h6SDNFF_6jtcyi0CKmAnb3q0Z-U_A",
            authDomain: "ofk-academy.firebaseapp.com",
            projectId: "ofk-academy",
            storageBucket: "ofk-academy.firebasestorage.app",
            messagingSenderId: "323159437100",
            appId: "1:323159437100:web:2cc41d6e2727737aea8689",
            measurementId: "G-BG5BDJL9EF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener("DOMContentLoaded", async () => {
            const role = localStorage.getItem("ofk_role");
            if (role && role !== "instructor") {
                window.location.href = "index.html";
                return;
            }
            await loadInstructorNotice();
        });

        async function loadInstructorNotice() {
            try {
                const snap = await getDoc(doc(db, "announcements", "portal_notices"));
                if (!snap.exists()) return;
                const notice = snap.data().instructorNotice;
                if (!notice || (!notice.title && !notice.body)) return;

                document.getElementById("instructorNoticeTitleDisplay").textContent = notice.title || "إعلان إداري للمدرسين";
                document.getElementById("instructorNoticeBodyDisplay").textContent = notice.body || "";
                document.getElementById("instructorNoticeBox").classList.remove("hidden");
            } catch (err) {
                console.warn("تعذر جلب إعلان المدرسين:", err);
            }
        }

        window.publishLecture = async function() {
            const title = document.getElementById("lectureTitle").value.trim();
            const specialty = document.getElementById("courseSpecialty").value;
            const fileUrl = document.getElementById("lectureUrl").value.trim();
            const msg = document.getElementById("uploadSuccessMsg");

            if (!title || !fileUrl) {
                alert("الرجاء إدخال عنوان المحاضرة والرابط بشكل صحيح.");
                return;
            }

            try {
                await addDoc(collection(db, "lectures"), {
                    title: title,
                    specialty: specialty,
                    fileUrl: fileUrl,
                    createdAt: new Date()
                });

                msg.classList.remove("hidden");
                document.getElementById("lectureTitle").value = "";
                document.getElementById("lectureUrl").value = "";

                setTimeout(() => { msg.classList.add("hidden"); }, 4000);
            } catch (error) {
                console.error("خطأ النشر:", error);
                alert("حدث خطأ أثناء الاتصال بقاعدة البيانات. تأكد من إعدادات الاتصال.");
            }
        };
    </script>
    <script>
        function logout() {
            localStorage.removeItem("ofk_role");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
