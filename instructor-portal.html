<!-- أضف هذا الجزء داخل قسم إدارة الدروس والمحاضرات في instructor-portal.html -->
<div class="bg-slate-900/60 border border-slate-700/60 p-4 rounded-xl space-y-3">
    <h4 class="font-bold text-sm text-white flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-amber-500"></i> إضافة درس جديد للمقرر
    </h4>
    <div class="flex gap-2">
        <input type="text" id="newLessonTitle" placeholder="عنوان الدرس الجديد..." class="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
        <button onclick="addNewLesson()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs px-4 py-2 rounded-xl transition-colors">نشر</button>
    </div>
</div>

<script>
    function addNewLesson() {
        const title = document.getElementById('newLessonTitle').value.trim();
        if (!title) {
            alert('يرجى إدخال عنوان الدرس');
            return;
        }
        
        // جلب الدروس السابقة أو إنشاء مصفوفة جديدة
        let lessons = JSON.parse(localStorage.getItem('ofk_dynamic_lessons') || '[]');
        lessons.push({
            id: Date.now(),
            title: title,
            date: new Date().toLocaleDateString('ar-SA'),
            instructor: 'الأستاذ المشرف'
        });
        
        localStorage.setItem('ofk_dynamic_lessons', JSON.stringify(lessons));
        document.getElementById('newLessonTitle').value = '';
        alert('تم نشر الدرس بنجاح وسيحصل عليه الطلاب فوراً في بواباتهم!');
    }
</script>
