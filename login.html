<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFK Academy | تسجيل الدخول</title>
    <!-- استخدام Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- إضافة خطوط وأيقونات أكاديمية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- إعدادات تطبيق الويب PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- شريط التنصيب العلوي الموحد -->
    <header class="bg-blue-950/85 backdrop-blur-md border-b border-slate-800 text-white sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-gradient-to-tr from-amber-500 to-amber-400 text-blue-950 px-3.5 py-1.5 rounded-xl font-black text-lg tracking-wider shadow border border-amber-300 flex items-center justify-center">
                    OFK
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-wide" dir="ltr">OFK Academy</h1>
                    <p class="text-[10px] text-amber-400/90 font-medium">المنصة الأكاديمية المستقلة</p>
                </div>
            </div>
            <nav class="hidden md:flex space-x-6 space-x-reverse text-sm font-medium">
                <a href="index.html" class="hover:text-amber-400 transition">الرئيسية</a>
                <a href="about.html" class="hover:text-amber-400 transition">من نحن</a>
                <a href="courses.html" class="hover:text-amber-400 transition">البرامج العامة</a>
                <a href="contact.html" class="hover:text-amber-400 transition">اتصل بنا</a>
                <a href="verify.html" class="hover:text-amber-400 transition">التحقق</a>
            </nav>
            <div>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition border border-slate-700 flex items-center">
                    <i class="fa-solid fa-house ml-1.5 text-amber-400"></i> الرئيسية
                </a>
            </div>
        </div>
    </header>

    <!-- محتوى صفحة تسجيل الدخول -->
    <main class="container mx-auto px-4 py-16 max-w-md flex-grow flex items-center justify-center">
        <div class="bg-slate-950/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl border border-slate-800 w-full text-right">
            
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-amber-400 text-blue-950 rounded-2xl mx-auto flex items-center justify-center text-3xl font-black shadow-lg mb-4 border border-amber-300">
                    OFK
                </div>
                <h2 class="text-2xl font-extrabold text-white mb-2">بوابة تسجيل الدخول</h2>
                <p class="text-slate-400 text-xs">أدخل بيانات الحساب الخاص بك للوصول إلى المنصة</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('عذراً، نظام المصادقة قيد التفعيل حالياً.');" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">البريد الإلكتروني أو اسم المستخدم:</label>
                    <input type="text" placeholder="name@example.com" class="w-full px-4 py-3 text-xs bg-slate-900 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-amber-500 focus:outline-none" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">كلمة المرور:</label>
                    <input type="password" placeholder="••••••••" class="w-full px-4 py-3 text-xs bg-slate-900 border border-slate-800 rounded-xl text-white focus:ring-2 focus:ring-amber-500 focus:outline-none" dir="ltr">
                </div>
                
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <label class="flex items-center space-x-2 space-x-reverse cursor-pointer">
                        <input type="checkbox" class="rounded bg-slate-900 border-slate-800 text-amber-500 focus:ring-amber-500">
                        <span>تذكرني</span>
                    </label>
                    <a href="contact.html" class="hover:text-amber-400 transition">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-blue-950 py-3.5 rounded-xl font-bold text-xs transition shadow-lg">
                    تسجيل الدخول
                </button>
            </form>

            <div class="mt-8 text-center text-xs text-slate-500 border-t border-slate-800/80 pt-4">
                تواجه مشكلة في الدخول؟ <a href="contact.html" class="text-amber-400 font-bold hover:underline">تواصل مع الإدارة</a>
            </div>

        </div>
    </main>

    <!-- التذييل -->
    <footer class="bg-slate-950 text-slate-400 text-center py-6 text-xs border-t border-slate-800">
        <p class="font-medium text-slate-300">OFK Academy - منصة أكاديمية مستقلة</p>
        <p class="mt-1 text-[11px] text-slate-500">جميع الحقوق محفوظة © 2026</p>
    </footer>

</body>
</html>
