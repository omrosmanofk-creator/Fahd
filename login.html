<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | OFK Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        amber: { 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900">

    <!-- الشريط العلوي -->
    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/20 text-slate-900 font-black text-xl">
                    OFK
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">OFK Academy</h1>
                    <p class="text-xs text-amber-500 font-medium">بوابة المصادقة والترخيص</p>
                </div>
            </div>
            <div>
                <a href="index.html" class="inline-flex items-center gap-2 text-slate-300 hover:text-amber-400 text-sm font-semibold transition-colors">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>الرئيسية</span>
                </a>
            </div>
        </div>
    </header>

    <!-- محتوى صفحة تسجيل الدخول -->
    <main class="flex-grow py-16 px-4 sm:px-6 lg:px-8 max-w-md mx-auto flex flex-col justify-center w-full">
        <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-8 shadow-2xl backdrop-blur-md space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-2xl mx-auto flex items-center justify-center text-3xl border border-amber-500/20 shadow-inner">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">تسجيل الدخول للبوابة</h2>
                <p class="text-xs text-slate-400">أدخل اسم المستخدم وكلمة المرور الخاصة بصلاحيتك</p>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">اسم المستخدم أو البريد</label>
                    <input type="text" id="usernameInput" required placeholder="Omr أو osmanomr466@gmail.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">كلمة المرور</label>
                    <input type="password" id="passwordInput" required placeholder="أدخل كلمة المرور" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 text-sm">
                </div>

                <div id="errorMsg" class="text-red-400 text-xs hidden bg-red-500/10 p-3 rounded-lg border border-red-500/20 text-center"></div>

                <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-900 font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-amber-500/20 transition-all text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>دخول المنصة</span>
                </button>
            </form>

            <!-- أزرار تجريبية سريعة لتسهيل الفحص -->
            <div class="border-t border-slate-700/60 pt-4 space-y-2">
                <p class="text-xs text-slate-400 text-center font-medium">تجربة سريعة للحسابات:</p>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="fillDemo('admin')" class="bg-slate-900 hover:bg-slate-700 text-amber-400 text-xs py-2 px-1 rounded-lg border border-slate-700 font-medium transition-colors">مدير النظام</button>
                    <button onclick="fillDemo('instructor')" class="bg-slate-900 hover:bg-slate-700 text-amber-400 text-xs py-2 px-1 rounded-lg border border-slate-700 font-medium transition-colors">مدرس</button>
                    <button onclick="fillDemo('student')" class="bg-slate-900 hover:bg-slate-700 text-amber-400 text-xs py-2 px-1 rounded-lg border border-slate-700 font-medium transition-colors">طالب</button>
                </div>
            </div>

        </div>
    </main>

    <!-- التذييل -->
    <footer class="bg-slate-800/80 border-t border-slate-700/50 py-6 text-center text-slate-400 text-xs">
        <p>جميع الحقوق محفوظة © OFK Academy 2026 — بالتعاون مع جامعة الزهراء</p>
    </footer>

    <!-- سكريبت المصادقة الذكي -->
    <script>
        function fillDemo(role) {
            document.getElementById('usernameInput').value = 'Omr';
            if(role === 'admin') document.getElementById('passwordInput').value = 'Omr12345';
            if(role === 'instructor') document.getElementById('passwordInput').value = 'Omr1234';
            if(role === 'student') document.getElementById('passwordInput').value = 'Omr123';
        }

        function handleLogin(event) {
            event.preventDefault();
            const pass = document.getElementById('passwordInput').value.trim();
            const errBox = document.getElementById('errorMsg');

            if (pass === 'Omr12345') {
                localStorage.setItem('userRole', 'admin');
                window.location.href = 'admin-portal.html';
            } else if (pass === 'Omr1234') {
                localStorage.setItem('userRole', 'instructor');
                window.location.href = 'instructor-portal.html';
            } else if (pass === 'Omr123') {
                localStorage.setItem('userRole', 'student');
                window.location.href = 'student-portal.html';
            } else {
                errBox.textContent = 'كلمة المرور غير صحيحة. يرجى التأكد من كلمة المرور المعتمدة.';
                errBox.classList.remove('hidden');
            }
        }
    </script>

</body>
</html>
