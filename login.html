<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | OFK Academy</title>
    <!-- Tailwind CSS للتصميم الاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- إعدادات PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-blue-950">

    <!-- الشريط العلوي الشامل (Navigation Bar) -->
    <header class="bg-blue-950/90 backdrop-blur-md border-b border-slate-800 text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <!-- الشعار -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <a href="index.html" class="bg-gradient-to-tr from-amber-500 to-amber-400 text-blue-950 px-3.5 py-1.5 rounded-xl font-black text-lg tracking-wider shadow border border-amber-300 flex items-center justify-center">
                    OFK
                </a>
                <div>
                    <h1 class="text-base font-extrabold tracking-wide" dir="ltr">OFK Academy</h1>
                    <p class="text-[10px] text-amber-400/90 font-medium">مركز التعليم التطبيقي المستمر</p>
                </div>
            </div>

            <!-- القوائم الرئيسية -->
            <nav class="hidden lg:flex space-x-5 space-x-reverse text-xs font-semibold">
                <a href="index.html" class="hover:text-amber-400 transition">الرئيسية</a>
                <a href="courses.html" class="hover:text-amber-400 transition">البرامج والدورات</a>
                <a href="verify.html" class="hover:text-amber-400 transition">التحقق من الشهادات</a>
                <a href="about.html" class="hover:text-amber-400 transition">عن الأكاديمية</a>
                <a href="contact.html" class="hover:text-amber-400 transition">اتصل بنا</a>
            </nav>

            <!-- زر العودة للرئيسية -->
            <div>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold px-3.5 py-2 rounded-xl text-xs transition flex items-center shadow">
                    <i class="fa-solid fa-house ml-1.5"></i> الرئيسية
                </a>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي: نموذج تسجيل الدخول -->
    <main class="container mx-auto px-4 py-16 max-w-md flex-grow flex items-center justify-center">
        <div class="bg-slate-950/90 p-8 rounded-2xl border border-slate-800 shadow-2xl backdrop-blur-md w-full">
            <div class="text-center mb-8">
                <div class="bg-blue-950 text-amber-400 w-12 h-12 rounded-2xl mx-auto flex items-center justify-center text-xl mb-3 border border-slate-800 shadow">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-xl font-extrabold text-white mb-2">تسجيل الدخول إلى البوابة</h2>
                <p class="text-slate-400 text-xs">أدخل بيانات الاعتماد الخاصة بك للوصول إلى حسابك الأكاديمي</p>
            </div>

            <form class="space-y-4" onsubmit="event.preventDefault(); alert('تم توجيهك بنجاح إلى البوابة الأكاديمية (نسخة تجريبية)');">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2" for="roleSelect">نوع الحساب / البوابة</label>
                    <select id="roleSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                        <option value="student">👨‍🎓 بوابة الطالب</option>
                        <option value="teacher">👩‍🏫 بوابة المدرس / المشرف</option>
                        <option value="admin">🏛️ لوحة الإدارة العامة</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2" for="email">البريد الإلكتروني الأكاديمي</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required placeholder="name@ofk-academy.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pr-10 pl-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2" for="password">كلمة المرور</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 pointer-events-none">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pr-10 pl-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-blue-950 font-bold py-3 rounded-xl text-xs transition shadow-lg flex items-center justify-center mt-2">
                    <i class="fa-solid fa-right-to-bracket ml-2"></i> تسجيل الدخول
                </button>
            </form>
        </div>
    </main>

    <!-- التذييل -->
    <footer class="bg-slate-950 text-slate-400 text-center py-6 text-xs border-t border-slate-800">
        <div class="container mx-auto px-4">
            <p class="font-medium text-slate-300">OFK Academy — منصة أكاديمية مستقلة للتأهيل المهني</p>
            <p class="mt-1 text-[11px] text-slate-500">جميع الحقوق محفوظة © 2026</p>
        </div>
    </footer>
</body>
</html>
