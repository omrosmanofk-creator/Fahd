<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFK Academy | تسجيل الدخول</title>
    <!-- استخدام Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- إضافة خطوط وأيقونات أكاديمية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900 min-h-screen font-sans text-slate-800 flex flex-col justify-between">

    <!-- شريط علوي بسيط للعودة للرئيسية -->
    <header class="p-6">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 space-x-reverse text-white">
                <div class="bg-gradient-to-tr from-amber-500 to-amber-400 text-blue-950 px-3 py-1.5 rounded-xl font-black text-lg tracking-wider shadow border border-amber-300">
                    OFK
                </div>
                <span class="font-extrabold text-lg tracking-wide" dir="ltr">OFK Academy</span>
            </a>
            <a href="index.html" class="text-slate-300 hover:text-amber-400 text-sm font-medium transition flex items-center">
                <i class="fa-solid fa-arrow-right ml-2"></i> العودة للرئيسية
            </a>
        </div>
    </header>

    <!-- محتوى صندوق تسجيل الدخول -->
    <main class="container mx-auto px-4 py-8 flex justify-center items-center flex-grow">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden max-w-md w-full p-8 md:p-10 border border-slate-100 relative">
            
            <!-- علامة أو شارة توضيحية -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-50 text-blue-900 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-blue-950">تسجيل الدخول للمنصة</h2>
                <p class="text-slate-500 text-xs mt-1">الرجاء إدخال بيانات الحساب للمتابعة</p>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form onsubmit="handleLogin(event)" class="space-y-5">
                
                <!-- اختيار نوع الحساب -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-2">نوع الحساب</label>
                    <select id="userType" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm bg-slate-50">
                        <option value="student">طالب (استعراض الدورات والنتائج)</option>
                        <option value="partner">شريك أكاديمي (جامعة الزهراء / مؤسسات)</option>
                        <option value="admin">مشرف المنصة (الإدارة العامة)</option>
                    </select>
                </div>

                <!-- البريد الإلكتروني -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-2">البريد الإلكتروني</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required placeholder="name@example.com" class="w-full pr-10 pl-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm bg-slate-50 text-left" dir="ltr">
                    </div>
                </div>

                <!-- كلمة المرور -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-slate-700">كلمة المرور</label>
                        <a href="#" class="text-[11px] text-blue-900 hover:text-amber-600 transition">نسيت كلمة المرور؟</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full pr-10 pl-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-900 text-sm bg-slate-50 text-left" dir="ltr">
                    </div>
                </div>

                <!-- زر الدخول -->
                <button type="submit" class="w-full bg-blue-950 hover:bg-blue-900 text-amber-400 font-bold py-3.5 rounded-xl shadow-lg transition duration-200 flex items-center justify-center text-sm">
                    <span>تسجيل الدخول</span>
                    <i class="fa-solid fa-arrow-left mr-2"></i>
                </button>
            </form>

            <!-- رسالة تنبيه تفاعلية عند تسجيل الدخول (مخفية افتراضياً) -->
            <div id="loginAlert" class="hidden mt-6 p-4 rounded-xl text-center text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 transition-all duration-300">
                <i class="fa-solid fa-circle-check ml-1 text-base"></i> تم تسجيل الدخول بنجاح! جاري تحويلك إلى لوحة التحكم الخاصة...
            </div>

            <div class="mt-8 text-center border-t border-slate-100 pt-5">
                <p class="text-xs text-slate-500">ليس لديك حساب بعد؟ <a href="contact.html" class="text-blue-900 font-bold hover:text-amber-600 transition">تواصل مع الإدارة لإنشاء حساب</a></p>
            </div>
        </div>
    </main>

    <!-- التذييل السفلي -->
    <footer class="text-center py-6 text-slate-400 text-xs">
        <p>جميع الحقوق محفوظة © 2026 - OFK Academy</p>
    </footer>

    <!-- سكريبت تفاعلي بسيط لإظهار رسالة النجاح -->
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            alertBox.classList.remove('hidden');
            
            // محاكاة الانتقال بعد ثانيتين
            setTimeout(() => {
                alert('أهلاً بك! تم محاكاة تسجيل الدخول بنجاح في النسخة التجريبية للمنصة.');
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>

</body>
</html>
